name: Publish application
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_BASE_PATH: /shixu/
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish static application
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Verify the deployed source revision
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          for (let attempt = 0; attempt < 8; attempt++) {
            try {
              const url = new URL('version.json', process.env.PAGE_URL);
              url.searchParams.set('revision', process.env.EXPECTED_REVISION);
              const response = await fetch(url, { headers: { 'Cache-Control': 'no-cache' } });
              if (!response.ok) throw new Error(`HTTP ${response.status}`);
              const build = await response.json();
              if (build.application !== 'shixu' || build.revision !== process.env.EXPECTED_REVISION)
                throw new Error('The public site still serves another revision');
              console.log(JSON.stringify(build));
              process.exit(0);
            } catch (error) {
              console.log(`Publish verification ${attempt + 1}: ${error.message}`);
              if (attempt < 7) await new Promise(resolve => setTimeout(resolve, 5000));
            }
          }
          process.exit(1);
          NODE
