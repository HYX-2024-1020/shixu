name: Verify

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: PR policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: node --test scripts/check-pr.test.mjs
      - run: node scripts/check-pr.mjs
      - run: node --test scripts/check-client-parity.test.mjs
      - run: node scripts/check-client-parity.mjs

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Gitleaks with checksum verification
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan all reachable history with redacted output
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts="--all" .'

  core:
    name: Core checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run mini:check
      - run: node scripts/build-reading-parser.mjs --check
      - run: node scripts/check-docs.mjs
      - run: node --test scripts/stage-a/*.test.mjs
      - run: node scripts/stage-a/rehearse.mjs
      - run: npm run reading:archive:build
      - run: node --test server/reading/*.test.mjs
      - run: npm run build
      - run: npm run test:server
      - run: npm run test:sync
      - run: npm run test:sync:release

  browser:
    name: Browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Use official Ubuntu mirror for browser dependencies
        shell: bash
        run: |
          # Hosted runner's Azure mirror timed out before browser tests started.
          # Keep the Ubuntu suite and signed indexes; change only this runner's mirror list.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            echo 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt
          fi
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-failure-report
          path: test-results/
          retention-days: 7

  desktop:
    name: Windows desktop
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run reading:archive:build
      - run: npm run test:desktop
      - run: npm run desktop:build
      - run: npm run test:desktop:ui
      - run: node scripts/desktop-reading-smoke.mjs
      - run: node scripts/desktop-reading-tasks-smoke.mjs
      - run: node scripts/desktop-reading-tasks-smoke.mjs --docx
      - run: node scripts/desktop-reading-tasks-smoke.mjs --xlsx
      - run: node scripts/desktop-reading-tasks-smoke.mjs --pdf
      - run: node scripts/desktop-reading-tasks-smoke.mjs --pdf-limit --temporary
      - run: node scripts/desktop-reading-tasks-smoke.mjs --pdf-windows --temporary
      - run: node scripts/desktop-reading-tasks-smoke.mjs --safety-rollback
      - run: node scripts/desktop-reading-tasks-smoke.mjs --audit-time --pdf-windows --temporary
      - run: node scripts/desktop-reading-tasks-smoke.mjs --zip --temporary
      - run: node scripts/desktop-reading-tasks-smoke.mjs --rar --temporary
      - run: node scripts/desktop-reading-tasks-smoke.mjs --7z --temporary
      - run: node scripts/desktop-reading-tasks-smoke.mjs --reuse
      - run: node scripts/desktop-reading-tasks-smoke.mjs --originals
      - run: node scripts/desktop-reading-tasks-smoke.mjs --temporary
      - run: node scripts/desktop-reading-tasks-smoke.mjs --reader-limit
      - run: node scripts/desktop-reading-tasks-smoke.mjs --reader-time-unknown
      - run: node scripts/desktop-account-v4-smoke.mjs
      - run: node scripts/desktop-layout-drag-smoke.mjs

  required:
    name: Required checks
    if: always()
    needs: [policy, secrets, core, browser, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every verification job to succeed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const jobs = JSON.parse(process.env.JOB_RESULTS); for (const [name, job] of Object.entries(jobs)) console.log(`${name}: ${job.result}`); if (Object.values(jobs).some(job => job.result !== "success")) process.exit(1);'
