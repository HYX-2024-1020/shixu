# Shixu public website: static content only; no upstream or business listeners.
server {
    listen 80 default_server;
    server_name _;
    access_log off;
    return 444;
}

server {
    listen 80;
    server_name shixunote.top www.shixunote.top;
    access_log off;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /srv/shixu-site/current;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 308 https://www.shixunote.top$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    access_log off;
}

server {
    listen 443 ssl;
    server_name shixunote.top;
    ssl_certificate /etc/letsencrypt/live/shixunote.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shixunote.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    server_tokens off;
    return 308 https://www.shixunote.top$request_uri;
}

server {
    listen 443 ssl;
    server_name www.shixunote.top;
    root /srv/shixu-site/current;
    index index.html;
    ssl_certificate /etc/letsencrypt/live/shixunote.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shixunote.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    autoindex off;
    access_log off;
    error_log /var/log/nginx/shixu-site-error.log warn;
    add_header Content-Security-Policy "default-src 'self'; script-src 'none'; style-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header Cache-Control "no-cache" always;
    error_page 404 /404.html;
    location / {
        limit_except GET { deny all; }
        try_files $uri $uri/ =404;
    }
    location ~ /\. {
        return 404;
    }
}
