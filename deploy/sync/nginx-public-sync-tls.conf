server {
    listen 443 ssl;
    server_name sync.shixunote.top;
    ssl_certificate /etc/letsencrypt/live/sync.shixunote.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sync.shixunote.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    access_log off;
    client_max_body_size 10m;
    add_header Strict-Transport-Security "max-age=86400" always;

    location ~ ^/api/v[34]/ {
        # Preserve the original request target for Windows signed requests.
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $server_name;
    }

    location / {
        return 404;
    }
}
