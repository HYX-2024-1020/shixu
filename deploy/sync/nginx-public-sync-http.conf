server {
    listen 80;
    server_name sync.shixunote.top;
    server_tokens off;
    access_log off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/shixu-sync-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://sync.shixunote.top$request_uri;
    }
}
